services:
  api:
    build:
      context: ../../
      dockerfile: docker/fanuel/Dockerfile
    command: uvicorn monitoring.fanuel.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../../monitoring/fanuel/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"