services:
  api:
    build:
      context: ../../
      dockerfile: docker/fanuel/Dockerfile
    command: uvicorn monitoring.fanuel.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ../../models:/app/models
    env_file:
      - ../../.env
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../../monitoring/fanuel/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      # 🔥 NEW: Auto-provision the data sources (Prometheus & Loki)
      - ../../monitoring/fanuel/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      # Auto-provision the dashboard config
      - ../../monitoring/fanuel/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      # Auto-provision the actual JSON dashboard
      - ../../monitoring/fanuel/grafana_dashboard.json:/etc/grafana/provisioning/dashboards/grafana_dashboard.json
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"