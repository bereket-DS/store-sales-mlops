stages:
  validate:
    wdir: ../..
    cmd: python -m src.fanuel.pipeline
    deps:
      - src/fanuel/pipeline.py
      - src/fanuel/data_loader.py
      - src/fanuel/feature_engineering.py
      - src/common/evaluate.py
      - data/raw
    outs:
      - data/processed/fanuel/valid_predictions.parquet:
          cache: false

  submit:
    wdir: ../..
    cmd: python -m src.fanuel.pipeline --submit
    deps:
      - src/fanuel/pipeline.py
      - src/fanuel/data_loader.py
      - src/fanuel/feature_engineering.py
      - src/common/evaluate.py
      - data/raw
    outs:
      - data/processed/fanuel/submission.csv